WORKSPACE_COUNT=9
WORKSPACES_ONLY_ON_PRIMARY=true
PRESERVE_WORKSPACE_MONITOR_FOCUS=true
CLOCK_FORMAT=12h
COLOR_SCHEME="prefer-dark"
GTK_THEME="Yaru-magenta-dark"
ICON_THEME="Yaru-magenta"
BACKGROUND_PRIMARY_COLOR="#023c88"
BACKGROUND_SECONDARY_COLOR="#5789ca"
BACKGROUND_COLOR_SHADING_TYPE="solid"
WALLPAPER_PATH="$HOME/.local/share/wallpapers/devtainer/1440w.png"
DISABLE_UBUNTU_DOCK=true
DISABLE_DESKTOP_ICONS=true
SCREENSHOT_BINDING="<Super><Alt>p"
SCREENSHOT_COMMAND="$HOME/.local/bin/devtainer-gnome-screenshot-area"
WINDOW_NEXT_BINDING="<Super>j"
WINDOW_PREV_BINDING="<Super>k"
CLOSE_WINDOW_BINDING="<Super>c"
TOGGLE_MAXIMIZE_BINDING="<Super>f"
KITTY_FOCUS_BINDING="<Super>Return"
KITTY_NEW_BINDING="<Super><Shift>Return"
CHROME_FOCUS_BINDING="<Super>b"
CHROME_NEW_BINDING="<Super><Shift>b"
FILES_FOCUS_BINDING="<Super>e"
FFPLAY_CAMERA_BINDING="<Super>s"
FFPLAY_CAMERA_DEVICE="/dev/video4"
FFPLAY_CAMERA_FRAMERATE=30
FFPLAY_CAMERA_VIDEO_SIZE="512x512"
FFPLAY_CAMERA_INPUT_FORMAT="mjpeg"
RECORD_AREA_BINDING="<Super><Shift>s"
RECORD_AREA_OUTPUT_DIR="$HOME/Video/recording"
RECORD_AREA_FRAMERATE=30
ROFI_WINDOW_BINDING="<Super>w"
ROFI_RUN_BINDING="<Super>r"
MONITOR_SWAP_BINDING="<Super>o"
EMOJI_PICKER_BINDING="<Super>semicolon"
ROFI_THEME_FILE="${XDG_CONFIG_HOME:-$HOME/.config}/rofi/devtainer-rofi.rasi"
